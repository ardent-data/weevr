[project]
name = "weevr"
version = "1.21.1" # x-release-please-version
description = "Metadata-driven execution engine for Fabric/Spark data pipelines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pierre LaFromboise", email = "44212292+DataInsightPro@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.14"
keywords = ["spark", "pyspark", "fabric", "etl", "data-pipeline", "yaml", "configuration", "delta-lake"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "weevr-core==1.21.1", # x-release-please-version
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Documentation = "https://ardent-data.github.io/weevr/"
Repository = "https://github.com/ardent-data/weevr"
Issues = "https://github.com/ardent-data/weevr/issues"
Changelog = "https://github.com/ardent-data/weevr/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weevr"
namespace = true

[dependency-groups]
# Two locked Spark stacks share one tool set. `dev` matches Fabric Runtime 1.3 and is the
# default (`uv sync --dev`); `rt2` matches Fabric Runtime 2.0 and is synced into its own
# environment: `UV_PROJECT_ENVIRONMENT=.venv-rt2 uv sync --no-dev --group rt2 --python 3.13`.
tools = [
    "interrogate>=1.7.0",
    "mike>=2.1.3,<3",
    "mkdocs-d2-plugin>=1.0.0,<2",
    "mkdocs-material>=9.7.3,<10",
    "mkdocstrings[python]>=1.0.3,<2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
]
dev = [
    { include-group = "tools" },
    "delta-spark>=3.2.0,<3.3.0",
    # Matches Fabric Runtime 1.3. OSS 3.5.6+ breaks alias overwrites.
    "pyspark>=3.5.5,<3.5.6",
]
rt2 = [
    { include-group = "tools" },
    # Matches Fabric Runtime 2.0 (Spark 4.1.1, Delta 4.2.0). Move only when Fabric does.
    "delta-spark==4.2.0",
    "pyspark==4.1.1",
]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "rt2" }]]
