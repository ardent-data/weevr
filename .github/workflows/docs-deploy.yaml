name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main, 1.x]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packages/weevr-core/src/weevr/**"
      - "packages/weevr/src/weevr/**"
      - "CONTRIBUTING.md"

permissions:
  contents: write

jobs:
  deploy-docs:
    # Publish only from the docs branch (repository variable DOCS_BRANCH, set
    # to 1.x once it exists, so prerelease docs never reach the site). Skip
    # release-please commits — the release workflow handles those.
    if: >-
      github.ref_name == (vars.DOCS_BRANCH || 'main') && (
        github.event_name == 'workflow_dispatch' ||
        !startsWith(
          github.event.head_commit.message,
          format('chore({0}): release', github.ref_name)
        )
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --
        env:
          D2_VERSION: "0.6.9"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=$(echo "$TAG" | sed -E 's/^(weevr-)?v([0-9]+\.[0-9]+).*/\2/')
          uv run mike deploy "$VERSION" latest --update-aliases --push
          uv run mike set-default latest --push
