name: Code Quality

on:
  push:
    branches:
      - main
      - 1.x
  pull_request:

permissions:
  contents: read

jobs:
  # The fast suite runs on every Python weevr supports: 3.11 and 3.12 on the
  # Runtime 1.3 stack (dev group), 3.13 on the Runtime 2.0 stack (rt2 group).
  # Lint, format, type, schema and docstring checks run once, on 3.11.
  ci:
    name: ci (Python ${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            groups: "--dev"
          - python: "3.12"
            groups: "--dev"
          - python: "3.13"
            groups: "--no-dev --group rt2"

    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Install uv (current major is v7) and enable uv cache
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      # Ensure the lock file matches and dev tools are installed
      # deterministically. --no-sync on every uv run below keeps the
      # environment this step built.
      - name: Sync (locked)
        run: uv sync --locked ${{ matrix.groups }}

      - name: Lint
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff check .

      - name: Format (check)
        if: matrix.python == '3.11'
        run: uv run --no-sync ruff format --check .

      - name: Type check
        if: matrix.python == '3.11'
        run: uv run --no-sync pyright .

      - name: Schema check
        if: matrix.python == '3.11'
        run: uv run --no-sync python scripts/generate_schema.py --check

      - name: Docstring coverage
        if: matrix.python == '3.11'
        run: >-
          uv run --no-sync interrogate packages/weevr-core/src/weevr/
          packages/weevr/src/weevr/ --fail-under 90

      - name: Tests (fast)
        run: uv run --no-sync pytest -n auto
