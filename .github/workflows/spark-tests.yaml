name: Spark Tests

on:
  push:
    branches:
      - main
      - 1.x
  # Docs, devcontainer, and tooling-only PRs skip the Spark suite. Every
  # push to main or 1.x still runs it in full.
  pull_request:
    paths:
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".tool-versions"
      - ".github/workflows/spark-tests.yaml"

permissions:
  contents: read

# Spark (on both Fabric runtime stacks) and fast tests run as parallel jobs;
# the Runtime 1.3 Spark job and the fast job write coverage data, which the
# spark-tests job combines to enforce the coverage gate.
jobs:
  spark-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      # Spark 3.5 can't start on JDK 23+ (Subject.getSubject is unsupported),
      # so don't rely on the runner image's default Java. 17 matches the
      # devcontainer.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      # Delta JARs are resolved from Maven on first session start; keep the
      # Ivy cache between runs. Keyed on the lockfile so a delta-spark bump
      # resolves fresh.
      - name: Cache Ivy (Delta JARs)
        id: ivy
        uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-

      # On a cold cache, two xdist workers resolving the same JARs into
      # ~/.ivy2 at once corrupt each other's downloads. Resolve them once,
      # in a single process, before the parallel run.
      - name: Resolve Delta JARs
        if: steps.ivy.outputs.cache-hit != 'true'
        run: >-
          uv run python -c "from delta import configure_spark_with_delta_pip;
          from pyspark.sql import SparkSession;
          configure_spark_with_delta_pip(SparkSession.builder.master('local[1]')).getOrCreate().stop()"

      - name: Spark tests with coverage
        # Two workers fit the 4-vCPU runner: each runs its own local[2]
        # Spark session, and more workers lose to JVM contention. The empty
        # --cov-report= skips the per-job report; the spark-tests job reports.
        env:
          COVERAGE_FILE: .coverage.spark
        run: uv run pytest -m spark -n 2 --cov=weevr --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-spark
          path: .coverage.spark
          include-hidden-files: true

  # The same suite on the Fabric Runtime 2.0 stack (Python 3.13, Spark 4.1,
  # Delta 4.2: the engine package's rt2 group). Coverage comes from the
  # Runtime 1.3 job; this one only has to pass.
  spark-suite-rt2:
    runs-on: ubuntu-latest

    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      # --no-sync on every uv run below keeps the rt2 environment; a plain
      # uv run would re-sync the default dev group.
      - name: Sync (locked)
        run: uv sync --locked --no-dev --group rt2

      - name: Cache Ivy (Delta JARs)
        id: ivy
        uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-rt2-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-rt2-${{ runner.os }}-

      - name: Resolve Delta JARs
        if: steps.ivy.outputs.cache-hit != 'true'
        run: >-
          uv run --no-sync python -c "from delta import configure_spark_with_delta_pip;
          from pyspark.sql import SparkSession;
          configure_spark_with_delta_pip(SparkSession.builder.master('local[1]')).getOrCreate().stop()"

      - name: Spark tests
        run: uv run --no-sync pytest -m spark -n 2

  fast-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      # Default selection: everything except Spark and install-smoke tests.
      # Code Quality runs the same selection on every PR; it runs again here
      # because this path-filtered workflow needs its coverage for the gate.
      - name: Fast tests with coverage
        env:
          COVERAGE_FILE: .coverage.fast
        run: uv run pytest -n auto --cov=weevr --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-fast
          path: .coverage.fast
          include-hidden-files: true

  spark-tests:
    needs: [spark-suite, spark-suite-rt2, fast-coverage]
    # Run even when a test job fails, so a failure reports here as a failed
    # gate rather than a skipped one; skip only when the run is cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every test job to pass
        if: >-
          needs.spark-suite.result != 'success' ||
          needs.spark-suite-rt2.result != 'success' ||
          needs.fast-coverage.result != 'success'
        run: |
          echo "spark-suite: ${{ needs.spark-suite.result }}"
          echo "spark-suite-rt2: ${{ needs.spark-suite-rt2.result }}"
          echo "fast-coverage: ${{ needs.fast-coverage.result }}"
          exit 1

      # Sources are needed for the report; both test jobs checked out to the
      # same runner path, so their data files combine without remapping.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-data

      # Pinned to the coverage version in uv.lock; uvx avoids syncing the
      # whole dev environment (PySpark included) just to combine.
      - name: Combine coverage and enforce the gate
        run: |
          uvx coverage@7.13.3 combine coverage-data/.coverage.spark coverage-data/.coverage.fast
          uvx coverage@7.13.3 report --fail-under=90 --show-missing --skip-covered
