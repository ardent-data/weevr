name: Spark Tests

on:
  push:
    branches:
      - main
  # Docs, devcontainer, and tooling-only PRs skip the Spark suite. Every
  # push to main still runs it in full.
  pull_request:
    paths:
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".tool-versions"
      - ".github/workflows/spark-tests.yaml"

permissions:
  contents: read

jobs:
  spark-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      # Spark 3.5 can't start on JDK 23+ (Subject.getSubject is unsupported),
      # so don't rely on the runner image's default Java. 17 matches the
      # devcontainer.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version-file: ".tool-versions"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --dev

      # Delta JARs are resolved from Maven on first session start; keep the
      # Ivy cache between runs. Keyed on the lockfile so a delta-spark bump
      # resolves fresh.
      - name: Cache Ivy (Delta JARs)
        uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Tests with coverage
        # Two workers fit the 4-vCPU runner: each runs its own local[2]
        # Spark session, and more workers lose to JVM contention.
        run: uv run pytest -m "" -n 2 --cov=weevr --cov-fail-under=90
